# CodeRabbit configuration
#
# Goal: one review per pull request, on final code. Fix rounds pushed after the
# first review used to spend a second review on a branch we were still working
# on; that is what this file stops.
#
# Shape taken from the reviewed version merged on DiazOnDemand main. The
# exclusions below are written for THIS repository (a single-package Next.js
# app plus a Cloudflare Worker), not copied from it.

reviews:
  # Already the default. Stated explicitly so nobody "tunes" it to assertive
  # later and wonders where the noise came from.
  profile: chill

  auto_review:
    enabled: true

    # THE ONE THAT MATTERS.
    # Default is true: CodeRabbit re-reviews as new commits land. With this off
    # it reviews once, and re-reviews only when asked with
    # `@coderabbitai review`, once the branch is actually ready.
    auto_incremental_review: false

    # Already the default. Draft pull requests are not reviewed, which is what
    # makes "open early as a draft" safe.
    drafts: false

  # Skip what nobody should be reviewing: generated, vendored, or binary.
  #
  # Absence from this list is not exclusion. CodeRabbit ships its own built-in
  # skip list (137 patterns, published under "Default ignored paths" at
  # https://docs.coderabbit.ai/configuration/path-instructions) and anything on
  # it stays skipped whatever this file says. Ordinary source and markdown are
  # not on it, so they are reviewed by default and simply need no entry here.
  path_filters:
    # DO NOT ADD AN ENTRY WITHOUT A LEADING `!`. Read this before you try.
    #
    # An entry without `!` is an INCLUDE, and a single include NARROWS the whole
    # review to only what it matches. Everything else is then skipped with
    # "excluded by none and included by none" - skipped not because something
    # excludes it, but because nothing includes it. That defect switched review
    # off for nearly all of DiazOnDemand for most of a day. If you think you
    # need a force-include, you do not; raise it instead of adding one.
    #
    # Config is read from the pull request HEAD branch, not the base, so a
    # change here can and should be tested in its own pull request.

    # Next.js build output and the static export target. Both gitignored, so
    # these are insurance against a stray `git add -f` rather than a live
    # problem.
    - '!**/.next/**'
    - '!**/out/**'
    # TypeScript incremental build state. tsconfig.tsbuildinfo is untracked but
    # present in the working tree, one `git add -f` away from a diff.
    - '!**/*.tsbuildinfo'
    # Generated by Next.js on every build, never hand-edited.
    - '!next-env.d.ts'
    # Test and coverage artifacts. This repo runs Vitest plus three Playwright
    # configs (default, collaboration, performance), and each writes here.
    - '!**/coverage/**'
    - '!**/playwright-report/**'
    - '!**/test-results/**'
    - '!**/.playwright-cli/**'
    # Wrangler's local state for the Cloudflare Worker under workers/.
    - '!**/.wrangler/**'
    # Raster images. None are tracked yet; a canvas product will grow them and
    # there is nothing to review in a binary image diff.
    #
    # SVG is deliberately absent from this group: `**/*.svg` is already on
    # CodeRabbit's built-in skip list, so the one tracked SVG is unreviewed
    # whatever this file says. That is a real gap - an SVG is text and can carry
    # executable content once inlined rather than served through an <img> - but
    # the only way to buy it back is an include, and an include costs the review
    # of every other file in the repository. Cover it with human eyes instead.
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.jpeg'
    - '!**/*.gif'
    - '!**/*.webp'
    - '!**/*.ico'

  # Keep. This is the summary Cody actually reads.
  high_level_summary: true

  # Keep. The status line is how we tell a finished review from a running one.
  review_status: true

  poem: false
